shell fish

# Schriftart
font_family      Maple Mono
font_size        14.0

# Transparenz
background_opacity 0.8
background_blur 1

# Fenster-Abstände (damit der Text nicht am Rand klebt)
window_padding_width 15

# Cursor
cursor #FF6B7A
cursor_shape beam

mouse_hide_wait -3.0
hide_window_decorations yes
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval -1 
cursor_stop_blinking_after 15.0

tab_bar_style powerline
tab_powerline_style slanted

# --- Theme Colors ---

# Background: Deep slate-grey from od_fsociety.png
background            #1F232A

# Foreground: Crisp cream-white
foreground            #E5E9F0 

# Selection highlights
selection_foreground  #1F232A
selection_background  #FF8593

# The ANSI Palette 
# Distributes colors to provide high contrast in tools like 'ls' or 'fastfetch'

# Black / Dark Grey
color0  #1A1D24
color8  #4C566A

# Red (The main fsociety salmon/crimson accent)
color1  #FF6B7A
color9  #FF8593

# Green (The classic terminal green from the bottom right block)
color2  #4AF626
color10 #75FF59

# Yellow (Muted cream/beige from the mask's skin tone)
color3  #E2D5C3
color11 #FFF3E3

# Blue (FIXED FOR FOLDERS: Swapped dark slate for high-contrast ice blues from the theme)
color4  #88C0D0
color12 #A3BE8C

# Magenta (Darker variations of the crimson banner)
color5  #C35562
color13 #D96E7C

# Cyan (Muted slate-blue for secondary details)
color6  #5E81AC
color14 #81A1C1

# White (General text output)
color7  #D8DEE9
color15 #ECEFF4
