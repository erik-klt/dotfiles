shell fish

# Schriftart
font_family      Maple Mono
font_size        13.0

# Transparenz
background_opacity 0.8
background_blur 1

# Fenster-Abstände (damit der Text nicht am Rand klebt)
window_padding_width 15

# Cursor
cursor #A1C85A
cursor_shape beam

mouse_hide_wait -3.0
hide_window_decorations yes
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval -1 
cursor_stop_blinking_after 15.0

tab_bar_style powerline
tab_powerline_style slanted

# --- Theme Colors ---

# Background: Pure black. Combined with 0.8 opacity, this ensures 
# the wallpaper's pure green tints the terminal, with zero brown muddiness.
background            #000000

# Foreground: Crisp, bright mint-white for highly readable typing text
foreground            #E0F0E5

selection_foreground  #000000
selection_background  #A1C85A

# The ANSI Palette (This fixes the Fastfetch dots!)
# We are forcing standard terminal colors to fit your wallpaper's palette.

# Black (Dark shadows)
color0  #0A0F0A
color8  #1A241A

# Red (Matches the tiny glowing orange lights in the wallpaper)
color1  #FF5B22
color9  #FF7B4D

# Green (Muted emerald greens)
color2  #4A8C5B
color10 #69A87A

# Yellow (The bright, toxic green from the window blinds)
color3  #A1C85A
color11 #BDE671

# Blue (Deep, dark swampy greens)
color4  #2A4030
color12 #3A5943

# Magenta (Forest/Moss greens)
color5  #3B5B42
color13 #4E7858

# Cyan (Teal-tinted greens)
color6  #527D5E
color14 #6BA37B

# White (General text output)
color7  #D0DED4
color15 #E0F0E5
