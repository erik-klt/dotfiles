# --- BACKGROUND ---
background {
    monitor =
    # Hier nehmen wir exakt dein Wallpaper von vorhin
    path = ~/Pictures/Wallpapers/sands.jpg
    
    # Macht das Bild elegant unscharf (Milchglas-Effekt)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- UHRZEIT ---
label {
    monitor =
    text = $TIME
    # Dein Sands-Gold (d4a373)
    color = rgba(212, 163, 115, 1.0)
    font_size = 120
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

# --- PASSWORT-FELD ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    
    # Goldener Rand
    outer_color = rgba(212, 163, 115, 1.0)
    # Dunkelblauer/Grauer Hintergrund (wie dein inaktiver Rahmen)
    inner_color = rgba(26, 27, 38, 0.8)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Passwort eingeben...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
