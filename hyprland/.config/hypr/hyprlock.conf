$wall = ~/Pictures/Wallpapers/greenroom.jpg

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0) # <-- Fixed: Changed 0 to 1.0
    font_family = Maple Mono
    font_size = 60
    position = 0, -20
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 1.0) # <-- Fixed: Changed 0 to 1.0
    font_size = 19
    font_family = Maple Mono
    position = 0, -90
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.1) # 0.1 is fine here, it will be a faint translucent box
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false 
    position = 0, -190
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(255, 255, 255, 1.0) # <-- Fixed: Changed 0 to 1.0
    font_size = 16
    font_family = Maple Mono
    position = 0, -190
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(255, 255, 255) # This one was working because rgb() is opaque by default
    check_color = rgba(0, 0, 0, 0.6)
    fail_color = rgba(255, 0, 0, 0.6)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">   Enter Pass</span></i>
    font_family = Maple Mono
    hide_input = false
    position = 0, -268
    halign = center
    valign = center
}
